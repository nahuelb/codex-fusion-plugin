<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650" role="img" aria-labelledby="title desc">
  <title id="title">The Fusion workflow</title>
  <desc id="desc">The main agent sets direction, sends a brief to one persistent sidekick, reviews its code and checks, and accepts the result. When changes are needed, review feedback returns to the sidekick.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect width="1000" height="650" rx="24" fill="#f8fafc"/>
  <g font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="64" y="63" font-size="15" font-weight="700" letter-spacing="3" fill="#64748b">FUSION</text>
    <text x="64" y="107" font-size="30" font-weight="600" fill="#0f172a">One lead. One persistent sidekick.</text>
    <rect x="56" y="146" width="398" height="440" rx="20" fill="#eef2ff"/>
    <rect x="546" y="146" width="398" height="440" rx="20" fill="#ecfdf5"/>
    <text x="88" y="190" font-size="20" font-weight="600" fill="#4338ca">Main agent</text>
    <text x="578" y="190" font-size="20" font-weight="600" fill="#047857">Sidekick</text>
    <text x="88" y="215" font-size="14" fill="#64748b">Direction and acceptance</text>
    <text x="578" y="215" font-size="14" fill="#64748b">Exploration and implementation</text>
    <g fill="#fff" stroke="#c7d2fe">
      <rect x="88" y="252" width="334" height="80" rx="12"/>
      <rect x="88" y="384" width="334" height="80" rx="12"/>
      <rect x="88" y="504" width="334" height="54" rx="12"/>
    </g>
    <rect x="578" y="252" width="334" height="212" rx="12" fill="#fff" stroke="#a7f3d0"/>
    <g font-size="19" font-weight="600" fill="#0f172a">
      <text x="110" y="283">Plan the task</text>
      <text x="110" y="415">Review and verify</text>
      <text x="110" y="538">Accept final code</text>
      <text x="600" y="290">Explore the code</text>
      <text x="600" y="354">Implement the brief</text>
      <text x="600" y="418">Run focused checks</text>
    </g>
    <g font-size="14" fill="#64748b">
      <text x="110" y="307">Scope, constraints, acceptance checks</text>
      <text x="110" y="439">Inspect the result and test it</text>
      <text x="600" y="314">Return findings when needed</text>
      <text x="600" y="378">Keep the same agent across handoffs</text>
      <text x="600" y="442">Report changes and evidence</text>
    </g>
    <g fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow)">
      <path d="M 422 284 H 578"/>
      <path d="M 578 416 H 422"/>
      <path d="M 255 464 V 504"/>
      <path d="M 422 448 H 464 Q 480 448 480 464 V 516 Q 480 532 496 532 H 729 Q 745 532 745 516 V 464"/>
    </g>
    <g font-size="12" font-weight="500" fill="#64748b" text-anchor="middle">
      <text x="500" y="271">Brief</text>
      <text x="500" y="402">Result</text>
      <text x="623" y="520">Edits if needed</text>
    </g>
    <text x="500" y="619" text-anchor="middle" font-size="14" fill="#64748b">Concise handoffs. Focused checks. Main-agent approval.</text>
  </g>
</svg>
